<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lumen Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed 1920x1080 stage, scaled to the screen (2x on a 4K panel). Screen one holds the top bar,
   a typographic title, a large Recently used shelf and two compact section rows. Inputs sit below the fold. */
:root {
  color-scheme: dark;
  --ink: #0c0d12;  --ink-2: #15161e;  --ink-3: #1e1f29;  --line: #2c2d39;
  --fg: #eeecf3;   --mute: #918e9f;   --accent: #f0b27a;  --danger: #ff9a9a;
  --r: 1;          --fade: 1200ms;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); overflow: hidden; font-family: var(--body); box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
#viewport { position: relative; width: 100%; height: 100%; }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: var(--ink); border-radius: 6px; }

/* ambient light: two layers cross-fade, so color changes are a slow dissolve */
.bgimg { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity .6s; }
.bgimg.on { opacity: .5; }
.glow { position: absolute; inset: 0; pointer-events: none; transition: opacity .6s; }
.glow > div { position: absolute; inset: 0; opacity: 0; will-change: opacity; transition: opacity var(--fade) cubic-bezier(.4,0,.2,1);
  background: radial-gradient(1250px 780px at 8% -12%, hsl(var(--g) 72% 46% / .40), transparent 70%),
              radial-gradient(1000px 680px at 110% 28%, hsl(calc(var(--g) + 36) 70% 42% / .22), transparent 70%); }
.glow > div.on { opacity: 1; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent 45%, rgb(0 0 0 / .5)); }

#page { position: absolute; left: 0; top: 0; width: 1920px; padding: 44px 96px 0; box-sizing: border-box; transition: transform .4s cubic-bezier(.2,.8,.2,1); }

/* gliding focus stroke */
.ring { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; box-sizing: border-box; border: 3px solid var(--fg);
  box-shadow: 0 0 30px hsl(var(--rh, 250) 85% 70% / .55), inset 0 0 0 1px rgb(0 0 0 / .25); will-change: transform, width, height; }
.ring.trail { z-index: 5; border: 2px solid hsl(var(--rh, 250) 85% 78% / .45); box-shadow: none; }

/* top bar */
.top { display: flex; align-items: center; gap: 18px; height: 72px; }
.place { font-family: var(--display); font-weight: 500; font-size: 36px; letter-spacing: -.01em; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.place i { width: 13px; height: 13px; border-radius: 50%; background: hsl(var(--hk, 250) 80% 70%); box-shadow: 0 0 22px hsl(var(--hk, 250) 80% 60%); transition: background 1s, box-shadow 1s; }
.weather { display: flex; align-items: center; gap: 12px; font-size: 26px; padding-left: 22px; margin-left: 6px; border-left: 1px solid var(--line); white-space: nowrap; }
.weather svg { width: 38px; height: 38px; }
.weather span { color: var(--mute); font-size: 21px; }
.tag { white-space: nowrap; font-family: var(--mono); font-size: 14px; color: var(--mute); border: 1px solid var(--line); padding: 5px 9px; border-radius: 6px; letter-spacing: .05em; margin-left: 8px; }
.spacer { flex: 1; }
.pill { font-family: var(--body); font-weight: 600; font-size: 23px; color: var(--fg); background: rgb(255 255 255 / .07); border: 0; border-radius: 999px;
  padding: 13px 26px; display: flex; align-items: center; gap: 11px; cursor: pointer; transition: transform .2s, background .2s, color .2s; white-space: nowrap; }
.pill svg { width: 24px; height: 24px; }
.pill.focus { background: var(--fg); color: var(--ink); transform: scale(1.07); }
.clock { text-align: right; margin-left: 14px; }
.clock b { display: block; font-family: var(--display); font-weight: 400; font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock span { font-size: 19px; color: var(--mute); white-space: nowrap; }

/* title */
.hero { height: 108px; margin-top: 14px; }
.hero p, .label small, .ov-head span, .peek, .st-other .s { display: none !important; }
.screen1 { height: 1036px; }
.hints[hidden] { display: none; }
.hero .kicker { font-family: var(--mono); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: hsl(var(--hk, 250) 60% 80%); transition: color 1s; }
.hero h1 { font-family: var(--display); font-weight: 300; font-size: 72px; line-height: .98; letter-spacing: -.035em; margin: 8px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero p { font-size: 22px; color: var(--mute); margin: 8px 0 0; }
.hero .fd { transition: opacity .18s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
.hero.swap .fd { opacity: 0; transform: translate(calc(var(--dx, 0) * -14px), calc(var(--dy, 0) * -8px)); }
.hero h1 span { display: inline-block; white-space: pre; }
.anim-letters span { animation: lIn .5s cubic-bezier(.16,.84,.24,1) both; animation-delay: calc(var(--i) * 15ms); }
.anim-slide span { animation: lIn .42s cubic-bezier(.16,.84,.24,1) both; }
.anim-fade span { animation: fIn .3s ease both; }
.hero h1.leaving span { animation: lOut .12s ease-in both; }
@keyframes lIn { from { opacity: 0; transform: translate(calc(var(--dx, 0) * 38px), calc(var(--dy, 0) * 26px)); filter: blur(7px); } }
@keyframes lOut { to { opacity: 0; transform: translate(calc(var(--dx, 0) * -26px), calc(var(--dy, 0) * -18px)); filter: blur(5px); } }
@keyframes fIn { from { opacity: 0; } }
html.device body { padding: 0; }
html.device .stage { border-radius: 0; }
.no-hero .hero { display: none; }

/* shelves */
.sec { margin-top: 22px; }
.sec.lead { margin-top: 22px; }
.label { font-weight: 600; font-size: 22px; color: var(--mute); letter-spacing: .02em; margin: 0 0 12px; display: flex; gap: 14px; align-items: baseline; }
.label small { font-weight: 400; font-size: 18px; opacity: .7; }
.row { display: grid; gap: 24px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
.row.big { gap: 32px; }
.pair { display: grid; grid-template-columns: calc((100% - 176px) / 7 * 6 + 120px) minmax(0, 1fr); gap: 56px; }
.pair > .sec { margin-top: 0; }
.pairwrap { margin-top: 22px; }
.row.fill .tw.small .art { aspect-ratio: auto; height: 106px; }
.tw { position: relative; cursor: pointer; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.art { position: relative; aspect-ratio: 16 / 9; border-radius: calc(22px * var(--r)); overflow: hidden;
  background: linear-gradient(150deg, hsl(var(--th) var(--ts) 38%), hsl(calc(var(--th) + 18) var(--ts) 15%));
  box-shadow: 0 1px 0 rgb(255 255 255 / .08) inset; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s; }
.tw.small .art { border-radius: calc(14px * var(--r)); }
.art img.banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art img.icon { position: absolute; left: 50%; top: 50%; height: 64%; aspect-ratio: 1; transform: translate(-50%, -50%); object-fit: contain; border-radius: 18%; }
.art .mono { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 12px; text-align: center; font-family: var(--display); font-weight: 600; font-size: 46px; letter-spacing: -.02em; line-height: 1; color: rgb(255 255 255 / .92); }
.tw.small .art .mono { font-size: 26px; }
.cap { font-size: 24px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; transition: color .18s, transform .18s; }
.tw.small .cap { font-size: 19px; }
.hide-names .cap { display: none; }
.art .sheen { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / .2) 50%, transparent 65%); transform: translateX(-120%); }
.tw.focus { z-index: 2; }
.tw.focus .art { transform: scale(1.06); box-shadow: 0 26px 50px -18px hsl(var(--th) 70% 22% / .9); }
.tw.small.focus .art { transform: scale(1.12); }
.row.fill .tw.small.focus .art { transform: scale(1.08); }
.tw.focus .cap { color: var(--fg); transform: translateY(6px); }
.tw.focus .sheen { transform: translateX(120%); transition: transform 1s ease; }
.tw.all .art { background: rgb(255 255 255 / .06); box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; }
.tw.all .art svg { width: 44px; height: 44px; }
.no-stroke .tw.focus .art, .no-stroke .incard.focus, .no-stroke .port.focus { outline: 4px solid var(--fg); outline-offset: 5px; }
.peek { position: absolute; left: 96px; bottom: 22px; font-size: 18px; color: var(--mute); display: flex; gap: 10px; align-items: center; transition: opacity .3s; }
.peek svg { width: 18px; height: 18px; }

/* inputs */
.inputs { margin-top: 30px; padding-bottom: 60px; }
.inputs .label { margin-bottom: 24px; }
.dock { display: grid; grid-template-columns: repeat(var(--dcols, 3), minmax(0, 1fr)); gap: 28px; }
.incard { position: relative; height: 220px; border-radius: calc(22px * var(--r)); padding: 26px 30px; box-sizing: border-box; cursor: pointer; overflow: hidden;
  transition: transform .18s cubic-bezier(.2,.8,.2,1); }
.incard.focus { transform: scale(1.05); z-index: 2; }
.incard .k { font-family: var(--mono); font-size: 18px; letter-spacing: .12em; text-transform: uppercase; opacity: .72; position: relative; }
.incard .n { font-family: var(--display); font-size: 58px; letter-spacing: -.025em; margin-top: 12px; line-height: 1; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.incard .s { position: absolute; left: 30px; bottom: 24px; font-size: 20px; display: flex; gap: 10px; align-items: center; opacity: .85; }
.sigdot { width: 11px; height: 11px; border-radius: 50%; background: currentColor; opacity: .3; }
.live .sigdot { background: var(--accent); opacity: 1; box-shadow: 0 0 14px var(--accent); }
.incard .glyph { position: absolute; right: 30px; bottom: 26px; opacity: .55; }
.st-mono { background: linear-gradient(160deg, #ececf1, #a3a4ad); color: #121216; }
.st-mono .n { font-weight: 400; }
.st-mono.live .sigdot { background: #121216; box-shadow: none; }
.st-red { background: linear-gradient(150deg, #e2313b, #8f121b); color: #fff; }
.st-red .n { font-weight: 700; letter-spacing: -.01em; }
.st-ambient { background: linear-gradient(150deg, hsl(var(--g0, 250) 45% 30%), hsl(var(--g0, 250) 45% 13%)); }
.st-ambient .n { font-weight: 400; }
.st-image { background: #000 center / cover no-repeat; }
.st-image::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(0 0 0 / .65), rgb(0 0 0 / .1)); }
.st-other { background: var(--ink-2); border: 2px dashed var(--line); }
.st-other .n { font-weight: 300; }
.jacks { display: flex; gap: 12px; }

/* port drawings */
.jack { flex: none; width: 70px; height: 32px; position: relative; display: inline-block; }
.jack::before { content: ""; position: absolute; inset: 0; border: 3px solid currentColor; clip-path: polygon(0 0, 100% 0, 100% 58%, 86% 100%, 14% 100%, 0 58%); border-radius: 3px; }
.jack::after { content: ""; position: absolute; left: 15px; right: 15px; top: 10px; height: 4px; background: currentColor; border-radius: 2px; }
.jack.sm { width: 40px; height: 19px; }
.jack.sm::before { border-width: 2px; }
.jack.sm::after { left: 9px; right: 9px; top: 6px; height: 3px; }

/* overlays */
.layer { position: absolute; inset: 0; z-index: 20; }
.solid { background: var(--ink); }
.ov-head { position: absolute; left: 96px; right: 96px; top: 64px; display: flex; align-items: baseline; gap: 22px; }
.ov-head h2 { font-family: var(--display); font-weight: 300; font-size: 84px; letter-spacing: -.03em; margin: 0; }
.ov-head span { font-family: var(--mono); font-size: 19px; color: var(--mute); letter-spacing: .05em; }
.scroller { position: absolute; left: 0; right: 0; top: 190px; bottom: 0; overflow: hidden; }
.inner { position: relative; padding: 24px 96px 120px; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.inner .sec:first-child { margin-top: 0; }

.ports { display: grid; grid-template-columns: repeat(var(--pc, 5), minmax(0, 1fr)); gap: 26px; }
.port { position: relative; height: 270px; border-radius: calc(20px * var(--r)); border: 2px dashed var(--line); padding: 28px; box-sizing: border-box; cursor: pointer;
  background: rgb(255 255 255 / .02); color: var(--mute); transition: transform .18s cubic-bezier(.2,.8,.2,1), background .18s; }
.port.focus { transform: scale(1.05); background: rgb(255 255 255 / .07); color: var(--fg); z-index: 2; }
.port .id { font-family: var(--mono); font-weight: 600; font-size: 28px; letter-spacing: .05em; color: var(--fg); margin-top: 34px; display: flex; gap: 12px; align-items: center; }
.port .pn { font-size: 24px; margin-top: 8px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.port.focus .pn { color: var(--fg); }
.port.unassigned .pn { font-style: italic; opacity: .6; }
.port .sigdot { position: absolute; right: 26px; top: 30px; }
.port .foot { position: absolute; left: 28px; bottom: 24px; font-size: 18px; color: var(--mute); }
.port.earc { border: 2px solid color-mix(in srgb, var(--accent) 75%, transparent); background: linear-gradient(165deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
.port.earc .jack { color: var(--accent); }
.badge { font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--ink); background: var(--accent); border-radius: 6px; padding: 3px 8px; }
.port .wave { position: absolute; right: 26px; bottom: 22px; width: 56px; color: var(--accent); }
.port.air { border-style: solid; border-color: var(--line); }
.port.air .gl { width: 70px; height: 40px; }

.launch { display: grid; place-content: center; text-align: center; background: linear-gradient(160deg, hsl(var(--th) var(--ts) 32%), hsl(calc(var(--th) + 20) var(--ts) 9%)); }
.launch h2 { font-family: var(--display); font-weight: 300; font-size: 190px; letter-spacing: -.04em; margin: 0; line-height: 1; }
.launch p { font-size: 30px; color: rgb(255 255 255 / .75); margin: 28px 0 0; }
.bar { width: 420px; height: 6px; border-radius: 3px; background: rgb(255 255 255 / .2); margin: 48px auto 0; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #fff; }
.launch.go .bar i { width: 100%; transition: width 1100ms cubic-bezier(.4,0,.2,1); }
.source { background: #050507; }
.source .chip { position: absolute; left: 96px; top: 72px; display: flex; gap: 16px; align-items: center; font-family: var(--mono); font-size: 26px;
  border: 1px solid var(--line); border-radius: 12px; padding: 16px 22px; background: rgb(255 255 255 / .04); }
.source .msg { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--mute); font-size: 30px; }
.source .msg b { display: block; font-family: var(--display); font-weight: 300; font-size: 96px; color: var(--fg); margin-bottom: 16px; }

/* quick options */
.sheet { background: rgb(4 4 7 / .62); }
.sheet .panel { position: absolute; right: 0; top: 0; bottom: 0; width: 640px; background: var(--ink-2); border-left: 1px solid var(--line); padding: 72px 52px; box-sizing: border-box; animation: slide .3s cubic-bezier(.2,.7,.2,1); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.panel h3 { font-family: var(--mono); font-size: 20px; letter-spacing: .1em; text-transform: uppercase; margin: 0; color: var(--mute); }
.panel h4 { font-family: var(--display); font-weight: 400; font-size: 54px; margin: 8px 0 34px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt { font-size: 27px; padding: 15px 22px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 16px; }
.opt small { font-size: 20px; opacity: .6; }
.opt.focus { background: var(--fg); color: var(--ink); }
.opt.danger { color: var(--danger); }
.opt.danger.focus { background: var(--danger); color: #210; }

/* Lumen Settings */
.settings { display: grid; grid-template-columns: 540px minmax(0, 1fr); background: var(--ink); }
.snav { background: var(--ink-2); border-right: 1px solid var(--line); padding: 68px 40px; display: flex; flex-direction: column; gap: 4px; }
.snav h2 { font-family: var(--display); font-weight: 300; font-size: 58px; letter-spacing: -.02em; margin: 0; }
.snav .sub { color: var(--mute); font-size: 20px; margin: 4px 0 30px 2px; }
.navi { font-size: 26px; padding: 15px 22px; border-radius: 12px; color: var(--mute); cursor: pointer; display: flex; align-items: center; gap: 16px; }
.navi svg { width: 26px; height: 26px; flex: none; }
.navi.sel { color: var(--fg); background: rgb(255 255 255 / .06); }
.navi.focus { background: var(--fg); color: var(--ink); }
.snav .foot { margin-top: auto; font-family: var(--mono); font-size: 15px; color: var(--mute); letter-spacing: .05em; }
.spane { position: relative; overflow: hidden; padding: 68px 96px 0; }
.crumb { font-family: var(--mono); font-size: 18px; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }
.spane h3 { font-family: var(--display); font-weight: 400; font-size: 54px; letter-spacing: -.02em; margin: 6px 0 12px; }
.note { font-size: 21px; color: var(--mute); max-width: 1000px; margin: 0 0 26px; line-height: 1.4; }
.sview { position: absolute; left: 96px; right: 96px; top: 250px; bottom: 40px; overflow: hidden; }
.srows { display: flex; flex-direction: column; gap: 6px; transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.srow { display: flex; align-items: center; gap: 20px; font-size: 26px; padding: 17px 24px; border-radius: 14px; min-height: 40px; cursor: pointer; }
.srow .v { margin-left: auto; color: var(--mute); display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.srow.focus { background: var(--fg); color: var(--ink); }
.srow.focus .v { color: #56535f; }
.srow.head { font-family: var(--mono); font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding: 22px 24px 6px; min-height: 0; cursor: default; }
.srow.danger { color: var(--danger); }
.srow.danger.focus { background: var(--danger); color: #210; }
.srow.grab { outline: 3px dashed var(--accent); outline-offset: -3px; }
.srow .idx { font-family: var(--mono); font-size: 18px; color: var(--mute); width: 34px; }
.sw { width: 58px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--mute); transition: transform .2s; }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(26px); background: #fff; }
.cyc::before { content: "‹"; margin-right: 12px; opacity: .5; }
.cyc::after { content: "›"; margin-left: 12px; opacity: .5; }
.chev::after { content: "›"; font-size: 32px; line-height: 0; }
.thumb { width: 72px; height: 42px; border-radius: 8px; background: var(--ink-3) center / cover no-repeat; border: 1px solid var(--line); }
.srow input { font: inherit; font-size: 24px; background: var(--ink-3); color: var(--fg); border: 2px solid var(--accent); border-radius: 10px; padding: 8px 14px; width: 560px; }
.srow textarea { font-family: var(--mono); font-size: 15px; width: 100%; height: 330px; background: var(--ink-3); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-sizing: border-box; resize: none; }
.srow.area { display: block; padding: 8px; }
.srow.area.focus { background: transparent; outline: 3px solid var(--fg); }

.dimmer { background: rgb(0 0 0 / .86); display: grid; place-content: center; text-align: center; }
.dimmer b { font-family: var(--display); font-weight: 300; font-size: 220px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.dimmer span { display: block; color: var(--mute); font-size: 28px; }

.hints { position: absolute; right: 96px; bottom: 22px; display: flex; gap: 22px; font-size: 17px; color: var(--mute); z-index: 30; }
.hints kbd { font-family: var(--mono); font-size: 14px; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; margin-right: 6px; background: var(--ink); }
.toast { position: absolute; left: 50%; top: 40px; transform: translate(-50%, -20px); opacity: 0; z-index: 40; background: var(--fg); color: var(--ink); font-weight: 600;
  font-size: 22px; padding: 14px 26px; border-radius: 999px; transition: opacity .25s, transform .25s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.reduce * { transition-duration: 0s !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; animation: none !important; } }
</style>

<div id="viewport">
  <div class="stage" id="stage">
    <div class="bgimg" id="bgimg"></div>
    <div class="glow" id="glow"><div></div><div></div></div>
    <div class="vignette"></div>
    <div id="page">
      <div class="screen1">
      <div class="top">
        <div class="place"><i></i><span id="tvName">Bedroom TV</span></div>
        <div class="weather" id="weather"></div>
        <span class="tag" id="protoTag">PREVIEW</span>

async function loadWeather() {

let actx = null;
const SFX = {
  soft:  { move: [1320, .05, "sine"], ok: [660, .11, "sine"], back: [520, .1, "sine"], edge: [240, .06, "triangle"] },
  click: { move: [2600, .018, "square"], ok: [1400, .04, "square"], back: [900, .04, "square"], edge: [320, .03, "square"] },
  glass: { move: [1760, .16, "sine"], ok: [1046, .32, "sine"], back: [784, .26, "sine"], edge: [392, .1, "triangle"] },

      g2.gain.setValueAtTime(.0001, t); g2.gain.exponentialRampToValueAtTime(vol * .3, t + .006); g2.gain.exponentialRampToValueAtTime(.0001, t + d * .6);
      o2.connect(g2).connect(actx.destination); o2.start(t); o2.stop(t + d); }

}

}

  closeLayer(); buildHome(); startFocus();
};
window.lumenResume = () => {
  syncInputs(); lastUsed = mergeRecents(lastUsed, TV.recents());
  if (view === "app") goHome(); else if (view === "home") { const k = focusKey(); buildHome(); restoreFocus(k); }
};
window.lumenToast = msg => toast(msg);
document.addEventListener("pointerdown", () => { wake(); });
stage.addEventListener("contextmenu", e => {
  const it = (view === "home" ? rows.flatMap(r => r.items) : view === "grid" ? grid.rows.flat() : []).find(i => i.el.contains(e.target));
  if (!it || !(it.kind === "app" || it.kind === "featured" || it.kind === "port")) return; e.preventDefault(); quickOptions(it);
});

/* ===================================================================== boot */
function fit() { const v = $("#viewport"), s = Math.min(v.clientWidth / 1920, v.clientHeight / 1080); stage.style.transform = `scale(${s}) translate(-50%, -50%)`; }
window.addEventListener("resize", fit); fit();
syncInputs(); applyCfg(); startFocus(); homeHints();
setInterval(tick, 10000); loadWeather(); setInterval(loadWeather, 15 * 60e3);
</script>

</body>
</html>
