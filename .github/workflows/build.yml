name: Build Lumen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Lumen-1.${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Lumen 1.${{ github.run_number }}
          make_latest: true
          files: Lumen-1.${{ github.run_number }}.apk
